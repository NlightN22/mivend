fragment CatalogSearchItem on SearchResult {
    productId
    productVariantId
    productName
    manufacturer {
        name
    }
    galleryPreviews
    slug
    sku
    priceWithTax {
        ... on SinglePrice {
            value
        }
        ... on PriceRange {
            min
        }
    }
    currencyCode
    stockLevel
    unitName
    unitRatioToBase
    multiplicity
    packagingLevels {
        name
        ratioToBase
    }
    facetValueIds
    customerPrice
    compareAtPrice
    discountTiers {
        percent
        minWeightKg
        minAmount
    }
    matchReasons
}

query CatalogProducts(
    $term: String
    $take: Int!
    $skip: Int!
    $collectionSlug: String
    $facetValueFilters: [FacetValueFilterInput!]
    $inStock: Boolean
    $priceRangeWithTax: PriceRangeInput
    $sort: SearchResultSortParameter
) {
    search(
        input: {
            term: $term
            take: $take
            skip: $skip
            groupByProduct: true
            collectionSlug: $collectionSlug
            facetValueFilters: $facetValueFilters
            inStock: $inStock
            priceRangeWithTax: $priceRangeWithTax
            sort: $sort
        }
    ) {
        totalItems
        skuMatches {
            total
            items {
                ...CatalogSearchItem
            }
        }
        partNumberMatches {
            total
            items {
                ...CatalogSearchItem
            }
        }
        manufacturerCodeMatches {
            total
            items {
                ...CatalogSearchItem
            }
        }
        items {
            ...CatalogSearchItem
        }
        facetValues {
            facetValue {
                id
                code
                name
                facet {
                    code
                    name
                }
            }
            count
        }
    }
}

query CatalogFacets(
    $term: String
    $collectionSlug: String
    $inStock: Boolean
    $priceRangeWithTax: PriceRangeInput
) {
    search(
        input: {
            term: $term
            take: 0
            skip: 0
            groupByProduct: true
            collectionSlug: $collectionSlug
            inStock: $inStock
            priceRangeWithTax: $priceRangeWithTax
        }
    ) {
        collections {
            collection {
                slug
            }
            count
        }
        facetValues {
            facetValue {
                id
                code
                name
                facet {
                    code
                    name
                }
            }
            count
        }
    }
}

query SearchCapabilities {
    searchCapabilities {
        sortKeys
        priceRange
    }
}
