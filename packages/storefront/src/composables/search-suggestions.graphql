query SearchSuggestions($term: String!, $collectionSlug: String) {
    search(
        input: {
            term: $term
            take: 5
            skip: 0
            groupByProduct: true
            collectionSlug: $collectionSlug
        }
    ) {
        skuMatches {
            items {
                productId
                productName
                manufacturer {
                    name
                }
                slug
                sku
            }
        }
        partNumberMatches {
            items {
                productId
                productName
                manufacturer {
                    name
                }
                slug
                sku
            }
        }
        manufacturerCodeMatches {
            items {
                productId
                productName
                manufacturer {
                    name
                }
                slug
                sku
            }
        }
        items {
            productId
            productName
            manufacturer {
                name
            }
            slug
            sku
        }
    }
}
