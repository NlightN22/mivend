query GeoConfig {
    geoConfig {
        providers {
            key
            publicKey
            params
        }
        defaultProvider
        defaultLatitude
        defaultLongitude
        defaultZoom
    }
}

query SearchAddress(
    $query: String!
    $biasLatitude: Float
    $biasLongitude: Float
    $provider: String
) {
    searchAddress(
        query: $query
        biasLatitude: $biasLatitude
        biasLongitude: $biasLongitude
        provider: $provider
    ) {
        address
        latitude
        longitude
    }
}

query ReverseGeocode($latitude: Float!, $longitude: Float!, $provider: String) {
    reverseGeocode(latitude: $latitude, longitude: $longitude, provider: $provider)
}
