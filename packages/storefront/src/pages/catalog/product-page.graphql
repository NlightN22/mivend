query ProductDetail($slug: String!) {
    product(slug: $slug) {
        id
        name
        slug
        description
        assets {
            preview
        }
        customFields {
            fullName
            manufacturerPartNumber
        }
        variants {
            id
            sku
            price
            customerPrice
            compareAtPrice
            currencyCode
            stockLevel
            customFields {
                multiplicity
                weight
            }
        }
        facetValues {
            name
            facet {
                code
                name
            }
        }
        manufacturer {
            name
        }
        collections {
            id
            name
            slug
            breadcrumbs {
                id
                name
                slug
            }
        }
    }
}
