query OrderProformaInvoices($orderCode: String!) {
    myProformaInvoices(options: { orderCode: $orderCode, take: 50 }) {
        items {
            id
            number
            version
            status
            displayStatus
            amount
            currencyCode
            orderChangedDifference
            supersededBy {
                id
                number
                version
            }
            document {
                status
                pdfUrl
            }
        }
    }
}

mutation RequestProformaInvoices($orderCode: String!) {
    requestProformaInvoices(orderCode: $orderCode) {
        id
        number
        version
        status
        displayStatus
    }
}
