query FavoriteProducts($ids: [String!]!, $take: Int!) {
    products(options: { take: $take, filter: { id: { in: $ids } } }) {
        items {
            id
            manufacturer {
                name
            }
            variants {
                id
                sku
                name
                customerPrice
                currencyCode
                stockLevel
            }
        }
    }
}
