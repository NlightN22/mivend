query OrderDetail($id: ID!) {
    order(id: $id) {
        id
        code
        state
        cancellable
        createdAt
        totalWithTax
        subTotalWithTax
        shippingWithTax
        currencyCode
        lines {
            id
            quantity
            unitPriceWithTax
            linePriceWithTax
            reserved
            reservedUntil
            productVariant {
                id
                customFields {
                    unitName
                    unitRatioToBase
                }
                sku
                name
                product {
                    name
                    slug
                }
            }
        }
        statusHistory {
            uuid
            status
            occurredAt
            reference {
                name
                description
                customerVisible
            }
        }
        shippingAddress {
            fullName
            streetLine1
            streetLine2
            city
            postalCode
            country
        }
        customFields {
            cancelRequestStatus
            erpStatus
            erpStatusAt
            erpOrderStatus
            erpPaidAmount
            erpRegistrationStatus
            erpRegistrationDocumentNumber
            tradingPointId
        }
    }
    myTradingPoints {
        id
        name
        address
    }
}
