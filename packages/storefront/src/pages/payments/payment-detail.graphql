query PaymentDetail($id: ID!) {
    payment(id: $id) {
        id
        amount
        currencyCode
        channel
        status
        createdAt
        proformaInvoiceId
        orderId
        externalReference
        refunds {
            id
            amount
            status
            providerRefundId
            reason
            createdAt
        }
        disputes {
            id
            type
            status
            amount
            openedAt
        }
        processingEvents {
            stage
            occurredAt
            note
        }
        proformaInvoice {
            id
            number
            status
        }
        order {
            id
            code
        }
        allocations {
            amount
            isAdvance
            proformaInvoice {
                id
                number
                amount
                currencyCode
                status
                order {
                    id
                    code
                }
            }
        }
    }
}
