query ProformaInvoiceDetail($id: ID!) {
    proformaInvoice(id: $id) {
        id
        number
        version
        orderId
        organizationId
        amount
        currencyCode
        displayStatus
        issuedAt
        dueDate
        kind
        contractName
        salesInvoiceNumber
        orderChangedDifference
        supersedes {
            id
            number
            version
        }
        supersededBy {
            id
            number
            version
        }
        seller {
            legalName
            inn
            kpp
            legalAddress
            bankName
            bankAccount
            bankBik
            correspondentAccount
        }
        document {
            status
            pdfUrl
        }
        order {
            id
            code
        }
        lines {
            quantity
            unitPriceWithTax
            linePriceWithTax
            productVariant {
                name
                sku
            }
        }
    }
}
