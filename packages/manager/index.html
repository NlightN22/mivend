<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="/favicon.svg" />
        <meta name="site-name" content="Shop" />
        <title>Shop manager portal</title>
        <script>
            // Mirrors ui-kit src/theme/theme.ts so the theme is set before first paint.
            try {
                var t = localStorage.getItem('mivend.theme');
                var dark =
                    t === 'dark' ||
                    (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
                document.documentElement.classList.toggle('dark', dark);
            } catch (e) {}
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
