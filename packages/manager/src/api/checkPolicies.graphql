query CheckDefinitions {
    checkDefinitions {
        code
        subjectType
        stages
        description
        defaultConsequence
        allowedConsequences
        stageConsequences
        stageDefaults
        defaultEnabled
    }
}

query CheckPolicies {
    checkPolicies {
        id
        checkCode
        stage
        branchId
        consequence
        recipient
        enabled
    }
}

mutation UpdateCheckPolicy($input: UpdateCheckPolicyInput!) {
    updateCheckPolicy(input: $input) {
        id
        checkCode
        stage
        branchId
        consequence
        recipient
        enabled
    }
}

mutation ResetCheckPolicyOverride($checkCode: String!, $stage: String!, $branchId: String!) {
    resetCheckPolicyOverride(checkCode: $checkCode, stage: $stage, branchId: $branchId)
}
