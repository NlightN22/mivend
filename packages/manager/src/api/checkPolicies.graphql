query OrderCheckDefinitions {
    checkDefinitions(subjectType: "order") {
        code
        stages
        description
        defaultConsequence
        allowedConsequences
        stageConsequences
        stageDefaults
        defaultEnabled
    }
}

query OrderCheckPolicies {
    checkPolicies(subjectType: "order") {
        id
        checkCode
        stage
        branchId
        consequence
        recipient
        enabled
    }
}

mutation UpdateCheckPolicy($input: UpdateCheckPolicyInput!) {
    updateCheckPolicy(input: $input) {
        id
        checkCode
        stage
        branchId
        consequence
        recipient
        enabled
    }
}

mutation ResetCheckPolicyOverride($checkCode: String!, $stage: String!, $branchId: String!) {
    resetCheckPolicyOverride(checkCode: $checkCode, stage: $stage, branchId: $branchId)
}
