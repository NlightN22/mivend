query PendingApprovalsBadgeCount {
    myApprovalRequestsSummary(recentLimit: 0) {
        pendingCount
    }
}

fragment ApprovalStepFields on ApprovalStep {
    id
    stepIndex
    requiredRole
    approverAdministratorId
    wasEscalated
    escalatedByAdministratorId
    escalatedToAdministratorId
    decision
    comment
    decidedAt
}

fragment ApprovalRequestSummaryFields on ApprovalRequest {
    id
    requestType
    status
    currentStepIndex
    currentStepRole
    stepRoles
    totalSteps
    requestedByAdministratorId
    createdAt
    decidedAt
    payload
    steps {
        ...ApprovalStepFields
    }
}

fragment ApprovalRequestPageFields on ApprovalRequestList {
    items {
        ...ApprovalRequestSummaryFields
    }
    totalItems
}

query ApprovalsInbox(
    $awaitingOptions: ApprovalListOptions
    $allInvolvedOptions: ApprovalListOptions
    $mineOptions: ApprovalListOptions
) {
    myApprovalsInbox(awaitingOptions: $awaitingOptions, allInvolvedOptions: $allInvolvedOptions) {
        awaitingMyDecision {
            ...ApprovalRequestPageFields
        }
        allInvolved {
            ...ApprovalRequestPageFields
        }
    }
    mine: myApprovalsInbox(awaitingOptions: { take: 0 }, allInvolvedOptions: $mineOptions) {
        allInvolved {
            ...ApprovalRequestPageFields
        }
    }
}

query ApprovalDetail($id: ID!) {
    approvalRequest(id: $id) {
        ...ApprovalRequestSummaryFields
        escalatesTo
        viewerCanDecide
    }
}

mutation DecidePriceAdjustmentRequest($requestId: ID!, $decision: String!, $comment: String) {
    decidePriceAdjustmentRequest(requestId: $requestId, decision: $decision, comment: $comment) {
        id
    }
}

mutation DecideDiscountGrantRequest($requestId: ID!, $decision: String!, $comment: String) {
    decideDiscountGrantRequest(requestId: $requestId, decision: $decision, comment: $comment) {
        id
    }
}

mutation DecideCreditTermRequest($requestId: ID!, $decision: String!, $comment: String) {
    decideCreditTermRequest(requestId: $requestId, decision: $decision, comment: $comment) {
        id
    }
}

query ApprovalOrderReferences($ids: [String!]!) {
    visibleOrders(options: { take: 200, filter: { id: { in: $ids } } }) {
        # bounded: by-id lookup for one inbox page
        items {
            id
            code
            customer {
                firstName
                lastName
            }
            lines {
                id
                quantity
                discountedUnitPriceWithTax
                productVariant {
                    name
                    sku
                }
            }
        }
    }
}

query ApprovalCounterparties($erpIds: [String!]!) {
    counterparties(options: { erpIds: $erpIds, take: 200 }) {
        # bounded: by-id lookup for one inbox page
        items {
            erpId
            shortName
        }
    }
}

mutation EscalateApprovalRequest($requestId: ID!, $escalateToAdministratorId: ID!) {
    escalateApprovalRequest(
        requestId: $requestId
        escalateToAdministratorId: $escalateToAdministratorId
    ) {
        id
    }
}
