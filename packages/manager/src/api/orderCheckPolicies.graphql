query OrderCheckDefinitions {
    checkDefinitions(subjectType: "order") {
        code
        subjectType
        stages
        description
        defaultConsequence
        allowedConsequences
        stageConsequences
        stageDefaults
        defaultEnabled
    }
}

query OrderCheckPolicies {
    checkPolicies(subjectType: "order") {
        id
        checkCode
        stage
        branchId
        consequence
        recipient
        enabled
    }
}
