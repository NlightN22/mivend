query ActingCounterparties($search: String!) {
    counterparties(options: { search: $search, take: 20, status: "active" }) {
        totalItems
        items {
            id
            shortName
            legalName
            inn
            priceType
            linkedCustomerId
            tradingPoints {
                id
                name
                address
                isActive
                customerStatus
            }
        }
    }
}

query ActingCounterparty($id: ID!) {
    counterparty(id: $id) {
        id
        shortName
        legalName
        inn
        priceType
        linkedCustomerId
        tradingPoints {
            id
            name
            address
            isActive
            customerStatus
        }
    }
}

mutation StartActingSession($counterpartyId: ID!, $tradingPointId: ID) {
    startActingSession(counterpartyId: $counterpartyId, tradingPointId: $tradingPointId) {
        ticket
        storefrontUrl
        expiresAt
    }
}
