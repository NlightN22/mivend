query Departments {
    departments {
        id
        erpId
        name
    }
}

query Positions {
    positions {
        id
        erpId
        name
    }
}

query TeamDirectory($options: TeamDirectoryListOptions) {
    teamDirectory(options: $options) {
        items {
            id
            erpId
            firstName
            lastName
            active
            roleCodes
            departmentId
            departmentName
            branchId
            position
        }
        totalItems
    }
}

query TeamDirectoryCounts(
    $all: TeamDirectoryListOptions
    $active: TeamDirectoryListOptions
    $inactive: TeamDirectoryListOptions
    $unassigned: TeamDirectoryListOptions
) {
    all: teamDirectory(options: $all) {
        totalItems
    }
    active: teamDirectory(options: $active) {
        totalItems
    }
    inactive: teamDirectory(options: $inactive) {
        totalItems
    }
    unassigned: teamDirectory(options: $unassigned) {
        totalItems
    }
}
