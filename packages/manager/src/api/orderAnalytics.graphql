query OrderAnalytics($input: OrderAnalyticsInput!) {
    orderAnalytics(input: $input) {
        state
        limitedToVisibleCustomers
        rows {
            periodStart
            dimensionId
            label
            currency
            turnover
            turnoverExcludingVat
            vatTotal
            orderCount
            ordersWithoutAmount
            productQuantity
            productAmount
            productLinesWithoutAmount
        }
    }
}

query OrderAnalyticsSuggest($kind: OrderAnalyticsFilterKind!, $prefix: String!) {
    orderAnalyticsSuggest(kind: $kind, prefix: $prefix)
}

query OrderAnalyticsGroupSuggest($kind: OrderAnalyticsGroupKind!, $prefix: String!) {
    orderAnalyticsGroupSuggest(kind: $kind, prefix: $prefix) {
        id
        name
    }
}

query AnalyticsFilterCapabilities {
    analyticsFilterCapabilities {
        groupKinds
    }
}

query OrderAnalyticsFilterValues($kind: OrderAnalyticsValueKind!) {
    orderAnalyticsFilterValues(kind: $kind) {
        state
        values {
            value
            orderCount
        }
    }
}
