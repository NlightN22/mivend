fragment ProformaInvoiceListItemFields on ProformaInvoice {
    id
    number
    version
    supersededBy {
        number
        version
    }
    createdAt
    orderId
    counterpartyId
    counterpartyShortName
    amount
    currencyCode
    displayStatus
    issuedAt
    dueDate
    branchId
    order {
        code
    }
}

query ProformaInvoicesPage($options: ProformaInvoiceListOptions, $counterpartyId: ID) {
    visibleProformaInvoices(options: $options, counterpartyId: $counterpartyId) {
        totalItems
        items {
            ...ProformaInvoiceListItemFields
        }
    }
}

query ProformaInvoiceViewCounts(
    $counterpartyId: ID
    $search: String
    $filter: ProformaInvoiceFilterParameter
) {
    all: visibleProformaInvoices(
        options: { take: 0, search: $search, filter: $filter }
        counterpartyId: $counterpartyId
    ) {
        totalItems
    }
    current: visibleProformaInvoices(
        options: { take: 0, status: "current", search: $search, filter: $filter }
        counterpartyId: $counterpartyId
    ) {
        totalItems
    }
    superseded: visibleProformaInvoices(
        options: { take: 0, status: "superseded", search: $search, filter: $filter }
        counterpartyId: $counterpartyId
    ) {
        totalItems
    }
    cancelled: visibleProformaInvoices(
        options: { take: 0, status: "cancelled", search: $search, filter: $filter }
        counterpartyId: $counterpartyId
    ) {
        totalItems
    }
}

query ProformaInvoiceOutstandingBalance($counterpartyId: ID!) {
    proformaInvoiceOutstandingBalance(counterpartyId: $counterpartyId) {
        amount
        currencyCode
    }
}
