fragment DiscountRegistryItemFields on DiscountRegistryEntry {
    id
    uuid
    number
    createdAt
    approvalRequestId
    discountRuleId
    status
    priceTypeCode
    facetCode
    facetValueCode
    percent
    validFrom
    validTo
    justification
    counterpartyIds
}

query DiscountRegistryPage($options: DiscountRegistryListOptions) {
    discountRegistryPage(options: $options) {
        items {
            ...DiscountRegistryItemFields
        }
        totalItems
    }
}

query DiscountViewCounts(
    $search: String
    $filter: DiscountRegistryFilterParameter
    $counterpartyId: ID
) {
    all: discountRegistryPage(
        options: { take: 0, search: $search, filter: $filter, counterpartyId: $counterpartyId }
    ) {
        totalItems
    }
    active: discountRegistryPage(
        options: {
            take: 0
            status: "active"
            search: $search
            filter: $filter
            counterpartyId: $counterpartyId
        }
    ) {
        totalItems
    }
    expiringSoon: discountRegistryPage(
        options: {
            take: 0
            status: "expiring-soon"
            search: $search
            filter: $filter
            counterpartyId: $counterpartyId
        }
    ) {
        totalItems
    }
    pending: discountRegistryPage(
        options: {
            take: 0
            status: "pending"
            search: $search
            filter: $filter
            counterpartyId: $counterpartyId
        }
    ) {
        totalItems
    }
    rejected: discountRegistryPage(
        options: {
            take: 0
            status: "rejected"
            search: $search
            filter: $filter
            counterpartyId: $counterpartyId
        }
    ) {
        totalItems
    }
}

query PriceTypeCodes {
    priceTypeCodes
}

query DiscountFacets {
    discountFacetOptions {
        code
        name
        values {
            code
            name
        }
    }
}
