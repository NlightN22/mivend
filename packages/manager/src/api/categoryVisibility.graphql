fragment CategoryCollectionFields on Collection {
    id
    name
    slug
    isPrivate
    breadcrumbs {
        id
        name
    }
    customFields {
        visibilityOverride
    }
}

query CategoryVisibilityCollections($skip: Int!, $take: Int!) {
    collections(options: { filter: { slug: { contains: "cat-" } }, skip: $skip, take: $take }) {
        items {
            ...CategoryCollectionFields
        }
        totalItems
    }
}

mutation SetCategoryVisibilityOverride($id: ID!, $visibilityOverride: String, $isPrivate: Boolean) {
    updateCollection(
        input: {
            id: $id
            isPrivate: $isPrivate
            customFields: { visibilityOverride: $visibilityOverride }
        }
    ) {
        ...CategoryCollectionFields
    }
}
