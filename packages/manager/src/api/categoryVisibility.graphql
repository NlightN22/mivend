fragment CategoryCollectionFields on Collection {
    id
    name
    slug
    isPrivate
    customFields {
        visibilityOverride
    }
}

# take: 999, no cursor — known limitation (mivend.audit.90 MEDIUM), not a final decision: if the
# category count ever exceeds this, the extras silently don't appear in the table. Revisit with
# real server-side pagination if/when that becomes a real risk.
query CategoryVisibilityCollections {
    collections(options: { filter: { slug: { contains: "cat-" } }, take: 999 }) {
        items {
            ...CategoryCollectionFields
        }
        totalItems
    }
}

mutation SetCategoryVisibilityOverride($id: ID!, $visibilityOverride: String, $isPrivate: Boolean) {
    updateCollection(
        input: {
            id: $id
            isPrivate: $isPrivate
            customFields: { visibilityOverride: $visibilityOverride }
        }
    ) {
        ...CategoryCollectionFields
    }
}
