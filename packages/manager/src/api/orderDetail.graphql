query OrderDetail($code: String!) {
    visibleOrders(options: { take: 1, filter: { code: { eq: $code } } }) {
        items {
            id
            code
            state
            cancellable
            orderPlacedAt
            createdAt
            creditLimitExceeded
            reservationState
            payments {
                id
                method
                state
                metadata
            }
            currencyCode
            packagesOnlySales
            subTotalWithTax
            shippingWithTax
            totalWithTax
            customFields {
                reservationDays
                branchId
                isExternal
                reservationFailureReason
                reservationFailureDetail
                reservationFailedAt
                erpStatus
                erpOrderId
                erpPaidAmount
                erpRegistrationStatus
                erpRegistrationDocumentNumber
                erpRejectionReasonCode
                erpRejectionReasonText
                tradingPointId
                deliveryAddress
            }
            shippingLines {
                shippingMethod {
                    code
                }
            }
            statusHistory {
                uuid
                status
                occurredAt
                reference {
                    name
                    description
                }
            }
            lines {
                id
                quantity
                featuredAsset {
                    preview
                }
                unitPriceWithTax
                discountedUnitPriceWithTax
                discountedLinePriceWithTax
                productVariant {
                    id
                    name
                    sku
                    customFields {
                        unitName
                        unitRatioToBase
                        unitWeightKg
                        unitVolumeM3
                    }
                }
                customFields {
                    manualUnitPrice
                    manualPriceReason
                }
            }
            customer {
                firstName
                lastName
            }
            counterparty {
                id
                shortName
                inn
                assignedManagerId
                priceType
                tradingPoints {
                    id
                    name
                    address
                    isActive
                    customerStatus
                }
            }
        }
    }
}

query PriceAdjustmentRequestsForOrder($orderId: ID!) {
    priceAdjustmentRequestsForOrder(orderId: $orderId) {
        id
        payload
        status
        currentStepRole
        createdAt
        decidedAt
    }
}

query RelatedDocuments($orderId: ID!) {
    documents(options: { take: 100 }, orderId: $orderId) {
        # bounded: documents of one order
        items {
            id
            type
            number
            status
            issueDate
            orderId
        }
    }
}
