query OrderDetail($code: String!) {
    visibleOrders(options: { take: 1, filter: { code: { eq: $code } } }) {
        items {
            id
            code
            state
            cancellable
            orderPlacedAt
            createdAt
            creditLimitExceeded
            payments {
                id
                method
                state
            }
            currencyCode
            packagesOnlySales
            subTotalWithTax
            shippingWithTax
            totalWithTax
            customFields {
                reservationDays
                reservationFailureReason
                reservationFailureDetail
                reservationFailedAt
                erpStatus
                erpOrderId
                erpPaidAmount
                erpRegistrationStatus
                erpRegistrationDocumentNumber
                erpRejectionReasonCode
                erpRejectionReasonText
                tradingPointId
                deliveryAddress
            }
            shippingLines {
                shippingMethod {
                    code
                }
            }
            lines {
                id
                quantity
                unitPriceWithTax
                linePriceWithTax
                productVariant {
                    id
                    name
                    sku
                    customFields {
                        unitName
                        unitRatioToBase
                        unitWeightKg
                        unitVolumeM3
                    }
                }
                customFields {
                    manualUnitPrice
                    manualPriceReason
                }
            }
            customer {
                firstName
                lastName
                counterparty {
                    id
                    shortName
                    inn
                    assignedManagerId
                    priceType
                    tradingPoints {
                        id
                        name
                        address
                        isActive
                        customerStatus
                    }
                }
            }
        }
    }
}

query PriceAdjustmentRequestsForOrder($orderId: ID!) {
    priceAdjustmentRequestsForOrder(orderId: $orderId) {
        id
        payload
        status
        currentStepRole
        createdAt
        decidedAt
    }
}

query RelatedDocuments($orderId: ID!) {
    documents(options: { take: 100 }, orderId: $orderId) {
        items {
            id
            type
            number
            status
            issueDate
            orderId
        }
    }
}
