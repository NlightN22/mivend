fragment WarehouseFields on Warehouse {
    id
    erpId
    name
    branchId
    isActive
    includedInBranchAtp
}

fragment BranchSettingsFields on BranchSettings {
    id
    branchId
    defaultPriceTypeId
    visiblePriceTypeIds
    defaultWarehouseId
    visibleWarehouseIds
    packagesOnly
}

query Warehouses {
    warehouses {
        ...WarehouseFields
    }
}

query BranchOptions {
    branches {
        id
        erpId
        name
    }
}

query PriceTypeOptions {
    priceTypes {
        id
        code
        name
    }
}

mutation UpdateWarehouseBranchAssignment(
    $warehouseId: ID!
    $branchId: String!
    $includedInBranchAtp: Boolean!
) {
    updateWarehouseBranchAssignment(
        warehouseId: $warehouseId
        branchId: $branchId
        includedInBranchAtp: $includedInBranchAtp
    ) {
        ...WarehouseFields
    }
}

query BranchSettingsForBranch($branchId: String!) {
    branchSettings(branchId: $branchId) {
        ...BranchSettingsFields
    }
}

mutation SetBranchSettings(
    $branchId: String!
    $defaultPriceTypeId: String!
    $visiblePriceTypeIds: [String!]
    $defaultWarehouseId: String!
    $visibleWarehouseIds: [String!]
    $packagesOnly: Boolean!
) {
    setBranchSettings(
        branchId: $branchId
        defaultPriceTypeId: $defaultPriceTypeId
        visiblePriceTypeIds: $visiblePriceTypeIds
        defaultWarehouseId: $defaultWarehouseId
        visibleWarehouseIds: $visibleWarehouseIds
        packagesOnly: $packagesOnly
    ) {
        ...BranchSettingsFields
    }
}
