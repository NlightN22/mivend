query PaymentCard($id: ID!) {
    payment(id: $id) {
        id
        number
        createdAt
        channel
        paymentStatus
        amount
        currencyCode
        providerPaymentId
        customer {
            id
            shortName
            inn
        }
        proformaInvoice {
            id
            number
            version
            amount
            currencyCode
            status
            dueDate
        }
        order {
            code
            state
            orderTotal
            currencyCode
        }
        refunds {
            id
            number
            amount
            status
            reason
            createdAt
        }
    }
}
