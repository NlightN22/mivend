fragment CustomerListItemFields on Counterparty {
    id
    shortName
    legalName
    inn
    innStatus
    isActive
    priceType
    assignedManagerId
    managerErpId
    branchId
    erpGroupLabel
    tradingPoints {
        id
        name
        address
        latitude
        longitude
        workingHours
        deliveryComment
        isActive
        defects
        customerUsable
        contacts {
            name
            phone
            email
            isPrimary
        }
    }
}

query CustomersPage($options: CounterpartyListOptions) {
    counterparties(options: $options) {
        items {
            ...CustomerListItemFields
            portalReadiness
            lastOrderAt
        }
        totalItems
    }
}

query CustomerFilterSuggestions($field: String!, $prefix: String!) {
    counterpartyFilterSuggestions(field: $field, prefix: $prefix, limit: 10)
}

query CustomersViewCounts(
    $all: CounterpartyListOptions
    $active: CounterpartyListOptions
    $inactive: CounterpartyListOptions
) {
    all: counterparties(options: $all) {
        totalItems
    }
    active: counterparties(options: $active) {
        totalItems
    }
    inactive: counterparties(options: $inactive) {
        totalItems
    }
}

query UnassignedCounterpartyCount {
    unassignedCounterpartyCount
}

query CustomersSummary {
    counterpartySummary {
        totalCount
        activeCount
        totalCreditBalance
        highUsageCount
    }
}

query CreditLimitExceededCounterpartyIds {
    creditLimitExceededCounterpartyIds
}

query HighUsageCustomers($limit: Int!) {
    highUsageCounterparties(limit: $limit) {
        ...CustomerListItemFields
        creditLimit
        creditBalance
    }
}

query CustomerById($id: ID!) {
    counterparty(id: $id) {
        ...CustomerListItemFields
    }
}

query CounterpartyShortName($id: ID!) {
    counterparty(id: $id) {
        shortName
    }
}

mutation ReassignCounterpartyManager($counterpartyId: ID!, $administratorId: ID!) {
    reassignCounterpartyManager(
        counterpartyId: $counterpartyId
        administratorId: $administratorId
    ) {
        id
    }
}

mutation UpdateTradingPointDetails($id: ID!, $input: TradingPointDetailsInput!) {
    updateTradingPointDetails(id: $id, input: $input) {
        id
    }
}

mutation SetTradingPointActive($id: ID!, $isActive: Boolean!) {
    setTradingPointActive(id: $id, isActive: $isActive) {
        id
    }
}

fragment PendingTradingPointChangeFields on TradingPointChange {
    id
    tradingPointId
    name
    address
    latitude
    longitude
    workingHours
    contactName
    contactPhone
}

query PendingTradingPointChanges {
    pendingTradingPointChanges {
        ...PendingTradingPointChangeFields
    }
}

mutation AcceptTradingPointChange($id: ID!) {
    acceptTradingPointChange(id: $id) {
        id
    }
}

mutation RejectTradingPointChange($id: ID!, $comment: String) {
    rejectTradingPointChange(id: $id, comment: $comment) {
        id
    }
}

query CustomerIdForCounterparty($counterpartyId: String!) {
    customers(options: { take: 1, filter: { counterpartyId: { eq: $counterpartyId } } }) {
        items {
            id
        }
    }
}

fragment CustomerOrderItemFields on Order {
    id
    code
    state
    totalWithTax
    currencyCode
    orderPlacedAt
    createdAt
    totalQuantity
    customer {
        firstName
        lastName
    }
    customFields {
        latestFulfillmentState
        placedByAdministratorId
        reservationState
    }
}

query CustomerOrders($customerId: ID!, $take: Int!) {
    visibleOrders(
        options: { take: $take, sort: { orderPlacedAt: DESC } }
        customerId: $customerId
    ) {
        items {
            ...CustomerOrderItemFields
        }
    }
}

query CustomerDocumentsPage($counterpartyId: ID!, $options: DocumentListOptions) {
    documents(options: $options, counterpartyId: $counterpartyId) {
        totalItems
        items {
            id
            type
            number
            status
            issueDate
        }
    }
}

query CustomerDocumentTypes($counterpartyId: ID!) {
    documentTypes(counterpartyId: $counterpartyId)
}

query CreditByCounterpartyId($options: CounterpartyListOptions) {
    counterparties(options: $options) {
        items {
            id
            creditLimit
            creditBalance
            paymentDelayDays
        }
    }
}

query CreditForCounterparty($id: ID!) {
    counterparty(id: $id) {
        creditLimit
        creditBalance
        paymentDelayDays
    }
}

query ActiveDiscountCounts($counterpartyIds: [ID!]!) {
    activeDiscountCounts(counterpartyIds: $counterpartyIds) {
        counterpartyId
        count
    }
}

