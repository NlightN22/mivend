query OrderProformaInvoices($orderId: ID!) {
    proformaInvoicesForOrder(orderId: $orderId) {
        id
        number
        version
        displayStatus
        issuedAt
        dueDate
        kind
        salesInvoiceNumber
        amount
        currencyCode
        organizationId
        orderChangedDifference
        seller {
            legalName
        }
        supersedes {
            id
            number
            version
        }
        supersededBy {
            id
            number
            version
        }
        document {
            status
            asset {
                source
            }
        }
    }
}

mutation RequestProformaInvoicesForOrder($orderId: ID!) {
    requestProformaInvoicesForOrder(orderId: $orderId) {
        id
    }
}

mutation WithdrawProformaInvoice($id: ID!) {
    withdrawProformaInvoice(id: $id) {
        id
    }
}
