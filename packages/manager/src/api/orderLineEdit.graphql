fragment OrderLineAvailabilityFields on OrderLineAvailability {
    orderLineId
    needed
    available
    fitting
    limitedBy
    step
    warehouses {
        warehouseErpId
        name
        free
    }
    organizations {
        id
        name
        stock
        hasContract
        selling
    }
}

query OrderLineAvailability($orderId: ID!) {
    orderLineAvailability(orderId: $orderId) {
        ...OrderLineAvailabilityFields
    }
}

mutation ChangeOrderLineQuantity($orderId: ID!, $orderLineId: ID!, $quantity: Int!) {
    changeOrderLineQuantity(orderId: $orderId, orderLineId: $orderLineId, quantity: $quantity)
}

mutation RemoveOrderLine($orderId: ID!, $orderLineId: ID!) {
    removeOrderLine(orderId: $orderId, orderLineId: $orderLineId)
}

mutation AddOrderLineBySku($orderId: ID!, $sku: String!, $quantity: Int!) {
    addOrderLineBySku(orderId: $orderId, sku: $sku, quantity: $quantity)
}

query ProductVariantsBySku($term: String!) {
    productVariants(
        options: {
            take: 8
            filter: { _or: [{ sku: { contains: $term } }, { name: { contains: $term } }] }
        }
    ) {
        items {
            id
            sku
            name
        }
    }
}

query OrderLineIdsBySku($orderId: String!) {
    visibleOrders(options: { take: 1, filter: { id: { eq: $orderId } } }) {
        items {
            lines {
                id
                unitPriceWithTax
                discountedUnitPriceWithTax
                productVariant {
                    sku
                }
            }
        }
    }
}

mutation SplitOrderLinesByStock($orderId: ID!) {
    splitOrderLinesByStock(orderId: $orderId) {
        orderLineId
        requested
        kept
        shortfall
    }
}

query OrderLineShortfalls($orderId: ID!) {
    orderLineShortfalls(orderId: $orderId) {
        id
        orderLineId
        sku
        name
        requestedQuantity
        keptQuantity
        shortfallQuantity
        limitedBy
        createdAt
    }
}

query OrderLineQuote($orderId: ID!, $sku: String!, $quantity: Int) {
    orderLineQuote(orderId: $orderId, sku: $sku, quantity: $quantity) {
        variantId
        sku
        name
        customerPrice
        referencePrice
        unitName
        multiple
        available
    }
}
