fragment OrderListItemFields on Order {
    id
    code
    state
    totalWithTax
    currencyCode
    orderPlacedAt
    createdAt
    creditLimitExceeded
    customFields {
        reservationState
        reservationFailureReason
        erpStatus
        hasCheckFindings
        placedByAdministratorId
    }
    customer {
        firstName
        lastName
        counterparty {
            shortName
            inn
            priceType
            assignedManagerId
            branchId
        }
    }
}

query OrdersPage($options: OrderListOptions, $managerId: ID, $customerId: ID, $search: String) {
    visibleOrders(
        options: $options
        managerId: $managerId
        customerId: $customerId
        search: $search
    ) {
        totalItems
        items {
            ...OrderListItemFields
        }
    }
}

query OrdersViewCounts(
    $customerId: ID
    $overdueBefore: DateTime!
    $awaitingConfirmation: OrderFilterParameter
    $processing: OrderFilterParameter
    $awaitingShipment: OrderFilterParameter
    $rejectedByErp: OrderFilterParameter
    $reservationFailed: OrderFilterParameter
    $erpRequirements: OrderFilterParameter
    $overdue: OrderFilterParameter
) {
    all: visibleOrders(options: { take: 0 }, customerId: $customerId) {
        totalItems
    }
    awaitingConfirmation: visibleOrders(
        options: { take: 0, filter: $awaitingConfirmation }
        customerId: $customerId
    ) {
        totalItems
    }
    processing: visibleOrders(
        options: { take: 0, filter: $processing }
        customerId: $customerId
    ) {
        totalItems
    }
    awaitingShipment: visibleOrders(
        options: { take: 0, filter: $awaitingShipment }
        customerId: $customerId
    ) {
        totalItems
    }
    rejectedByErp: visibleOrders(
        options: { take: 0, filter: $rejectedByErp }
        customerId: $customerId
    ) {
        totalItems
    }
    reservationFailed: visibleOrders(
        options: { take: 0, filter: $reservationFailed }
        customerId: $customerId
    ) {
        totalItems
    }
    erpRequirements: visibleOrders(
        options: { take: 0, filter: $erpRequirements }
        customerId: $customerId
    ) {
        totalItems
    }
    overdue: visibleOrders(options: { take: 0, filter: $overdue }, customerId: $customerId) {
        totalItems
    }
    ordersAttention(overdueBefore: $overdueBefore) {
        pendingPriceAdjustmentOrderIds
    }
}

query TeamMembers {
    teamMembers {
        id
        firstName
        lastName
        emailAddress
        roleCodes
    }
}

query Branches {
    branches {
        id
        erpId
        name
    }
}
