fragment OrderListItemFields on Order {
    id
    code
    state
    totalWithTax
    currencyCode
    orderPlacedAt
    createdAt
    creditLimitExceeded
    customFields {
        reservationState
        reservationFailureReason
        erpStatus
        hasCheckFindings
    }
    customer {
        firstName
        lastName
        counterparty {
            shortName
            inn
            priceType
            assignedManagerId
            branchId
        }
    }
}

query OrdersPage($options: OrderListOptions, $managerId: ID, $search: String) {
    visibleOrders(options: $options, managerId: $managerId, search: $search) {
        totalItems
        items {
            ...OrderListItemFields
        }
    }
}

query OrdersSummary($overdueBefore: DateTime!, $todayStart: DateTime!) {
    open: visibleOrders(
        options: {
            take: 0
            filter: { state: { notIn: ["AddingItems", "Draft", "Cancelled", "Delivered"] } }
        }
    ) {
        totalItems
    }
    overdue: visibleOrders(
        options: {
            take: 0
            filter: { state: { eq: "PaymentSettled" }, orderPlacedAt: { before: $overdueBefore } }
        }
    ) {
        totalItems
    }
    today: visibleOrders(options: { take: 0, filter: { orderPlacedAt: { after: $todayStart } } }) {
        totalItems
    }
    todayAmount: visibleOrdersAmount(options: { filter: { orderPlacedAt: { after: $todayStart } } })
    openAmount: visibleOrdersAmount(
        options: {
            filter: { state: { notIn: ["AddingItems", "Draft", "Cancelled", "Delivered"] } }
        }
    )
    processing: visibleOrders(
        options: { take: 0, filter: { state: { eq: "PaymentAuthorized" } } }
    ) {
        totalItems
    }
    drafts: visibleOrders(options: { take: 0, filter: { state: { eq: "Draft" } } }) {
        totalItems
    }
    pendingPriceAdjustmentOrderIds
}

fragment AttentionOrderFields on Order {
    id
    code
    state
    orderPlacedAt
    customer {
        firstName
        lastName
    }
}

query OrdersAttention($pendingIds: [String!]!, $overdueBefore: DateTime!) {
    waiting: visibleOrders(
        options: {
            take: 5
            filter: {
                id: { in: $pendingIds }
                state: { notIn: ["AddingItems", "Draft", "Cancelled", "Delivered"] }
            }
        }
    ) {
        totalItems
        items {
            ...AttentionOrderFields
        }
    }
    overdueRows: visibleOrders(
        options: {
            take: 5
            sort: { orderPlacedAt: ASC }
            filter: { state: { eq: "PaymentSettled" }, orderPlacedAt: { before: $overdueBefore } }
        }
    ) {
        items {
            ...AttentionOrderFields
        }
    }
    both: visibleOrders(
        options: {
            take: 0
            filter: {
                id: { in: $pendingIds }
                state: { eq: "PaymentSettled" }
                orderPlacedAt: { before: $overdueBefore }
            }
        }
    ) {
        totalItems
    }
}

query TeamMembers {
    teamMembers {
        id
        firstName
        lastName
        emailAddress
        roleCodes
    }
}

query Branches {
    branches {
        id
        erpId
        name
    }
}

fragment SavedTableViewFields on SavedTableView {
    id
    name
    filters
    visibleColumns
}

query MyTableViews($pageKey: String!) {
    myTableViews(pageKey: $pageKey) {
        ...SavedTableViewFields
    }
}

mutation SaveTableView(
    $pageKey: String!
    $name: String!
    $filters: String!
    $visibleColumns: [String!]!
) {
    saveTableView(
        pageKey: $pageKey
        name: $name
        filters: $filters
        visibleColumns: $visibleColumns
    ) {
        ...SavedTableViewFields
    }
}

mutation DeleteTableView($id: ID!) {
    deleteTableView(id: $id)
}
