fragment OrderListItemFields on Order {
    id
    code
    state
    totalWithTax
    currencyCode
    orderPlacedAt
    createdAt
    creditLimitExceeded
    customFields {
        reservationState
        reservationFailureReason
        erpStatus
        hasCheckFindings
        placedByAdministratorId
    }
    customer {
        firstName
        lastName
    }
    counterparty {
        shortName
        inn
        priceType
        assignedManagerId
        branchId
    }
}

query OrdersPage($list: OrderListInput, $managerId: ID, $customerId: ID, $search: String) {
    visibleOrders(
        list: $list
        managerId: $managerId
        customerId: $customerId
        search: $search
    ) {
        totalItems
        items {
            ...OrderListItemFields
        }
    }
}

query OrdersViewCounts(
    $customerId: ID
    $managerId: ID
    $search: String
    $overdueBefore: DateTime!
    $all: OrderListFilter
    $awaitingConfirmation: OrderListFilter
    $processing: OrderListFilter
    $awaitingShipment: OrderListFilter
    $rejectedByErp: OrderListFilter
    $reservationFailed: OrderListFilter
    $erpRequirements: OrderListFilter
    $overdue: OrderListFilter
) {
    all: visibleOrders(
        list: { take: 0, filter: $all }
        customerId: $customerId
        managerId: $managerId
        search: $search
    ) {
        totalItems
    }
    awaitingConfirmation: visibleOrders(
        list: { take: 0, filter: $awaitingConfirmation }
        customerId: $customerId
        managerId: $managerId
        search: $search
    ) {
        totalItems
    }
    processing: visibleOrders(
        list: { take: 0, filter: $processing }
        customerId: $customerId
        managerId: $managerId
        search: $search
    ) {
        totalItems
    }
    awaitingShipment: visibleOrders(
        list: { take: 0, filter: $awaitingShipment }
        customerId: $customerId
        managerId: $managerId
        search: $search
    ) {
        totalItems
    }
    rejectedByErp: visibleOrders(
        list: { take: 0, filter: $rejectedByErp }
        customerId: $customerId
        managerId: $managerId
        search: $search
    ) {
        totalItems
    }
    reservationFailed: visibleOrders(
        list: { take: 0, filter: $reservationFailed }
        customerId: $customerId
        managerId: $managerId
        search: $search
    ) {
        totalItems
    }
    erpRequirements: visibleOrders(
        list: { take: 0, filter: $erpRequirements }
        customerId: $customerId
        managerId: $managerId
        search: $search
    ) {
        totalItems
    }
    overdue: visibleOrders(
        list: { take: 0, filter: $overdue }
        customerId: $customerId
        managerId: $managerId
        search: $search
    ) {
        totalItems
    }
    ordersAttention(overdueBefore: $overdueBefore) {
        pendingPriceAdjustmentOrderIds
    }
}

query TeamMembers {
    teamMembers {
        id
        firstName
        lastName
        emailAddress
        roleCodes
    }
}

query Branches {
    branches {
        id
        erpId
        name
    }
}
