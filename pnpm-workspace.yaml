packages:
    - 'apps/*'
    - 'packages/*'
    - 'packages/plugins/*'
allowBuilds:
    '@apollo/protobufjs': true
    '@scarf/scarf': false
    bcrypt: true
    esbuild: true
    msgpackr-extract: true
    msw: true
    puppeteer: true
    sharp: true
    vue-demi: true
minimumReleaseAgeExclude:
    - '@nlightn22/event-contracts@0.4.0 || 0.5.0 || 0.13.0'
