name: Publish app images

on:
    workflow_dispatch:

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { image: mivend-server, file: apps/server/Dockerfile, npmrc: true }
                    - {
                          image: mivend-storefront,
                          file: packages/storefront/Dockerfile,
                          npmrc: false,
                      }
                    - { image: mivend-manager, file: packages/manager/Dockerfile, npmrc: false }
                    - { image: mivend-dashboard, file: packages/dashboard/Dockerfile, npmrc: true }

        steps:
            - uses: actions/checkout@v4

            - name: Read version from package.json
              id: pkg
              run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
                  tags: |
                      type=raw,value=latest
                      type=raw,value=v${{ steps.pkg.outputs.version }}
                      type=sha,prefix=sha-

            - uses: docker/setup-buildx-action@v3

            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ${{ matrix.file }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.image }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}
                  secrets: ${{ matrix.npmrc && format('npmrc=//npm.pkg.github.com/:_authToken={0}', secrets.PACKAGES_READ_TOKEN) || '' }}
