services:
    server:
        image: ghcr.io/nlightn22/mivend-server:${IMAGE_TAG:-latest}
        environment:
            NODE_ENV: production
            DB_HOST: postgres
            DB_PORT: 5432
            DB_USERNAME: ${POSTGRES_USER:-postgres}
            DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            DB_NAME: ${POSTGRES_DB:-mivend}
            DB_EXPECTED_LOCALE: ${DB_ICU_LOCALE:?DB_ICU_LOCALE must be set explicitly (e.g. ru-RU) — see docs/environments.md}
            INSTANCE_TYPE: ${INSTANCE_TYPE:-branch}
            PORT: 3000
            SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
            SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-superadmin}
        ports:
            - '3000:3000'
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        restart: unless-stopped

    worker:
        image: ghcr.io/nlightn22/mivend-server:${IMAGE_TAG:-latest}
        command: ['node', 'dist/worker.js']
        environment:
            NODE_ENV: production
            DB_HOST: postgres
            DB_PORT: 5432
            DB_USERNAME: ${POSTGRES_USER:-postgres}
            DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            DB_NAME: ${POSTGRES_DB:-mivend}
            DB_EXPECTED_LOCALE: ${DB_ICU_LOCALE:?DB_ICU_LOCALE must be set explicitly (e.g. ru-RU) — see docs/environments.md}
            INSTANCE_TYPE: ${INSTANCE_TYPE:-branch}
            SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
            SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-superadmin}
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        restart: unless-stopped

    worker-email:
        image: ghcr.io/nlightn22/mivend-server:${IMAGE_TAG:-latest}
        command: ['node', 'dist/worker-email.js']
        environment:
            NODE_ENV: production
            DB_HOST: postgres
            DB_PORT: 5432
            DB_USERNAME: ${POSTGRES_USER:-postgres}
            DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            DB_NAME: ${POSTGRES_DB:-mivend}
            DB_EXPECTED_LOCALE: ${DB_ICU_LOCALE:?DB_ICU_LOCALE must be set explicitly (e.g. ru-RU) — see docs/environments.md}
            INSTANCE_TYPE: ${INSTANCE_TYPE:-branch}
            SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
            SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-superadmin}
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        restart: unless-stopped

    postgres:
        build: ./postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-mivend}
            POSTGRES_APP_DB: ${POSTGRES_DB:-mivend}
            # Issue #140: fixed at initdb time, no default — see docs/environments.md.
            DB_ICU_LOCALE: ${DB_ICU_LOCALE:?DB_ICU_LOCALE must be set explicitly (e.g. ru-RU) — see docs/environments.md}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    rabbitmq:
        image: ghcr.io/nlightn22/mivend-rabbitmq:latest
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mivend}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-mivend}
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', 'ping']
            interval: 10s
            timeout: 10s
            retries: 10
        restart: unless-stopped

    # Issue #115: production build (bundled/minified, not the raw Vite dev server every contour
    # uses today) served via nginx. Host port intentionally left as a plain default here — which
    # external port these are actually published on (if at all) is a deliberate decision for the
    # publish-service skill/workflow, not something this compose file decides on its own.
    storefront:
        image: ghcr.io/nlightn22/mivend-storefront:${IMAGE_TAG:-latest}
        environment:
            API_TARGET: http://server:3000
        ports:
            - '${STOREFRONT_PORT:-8004}:80'
        depends_on:
            - server
        restart: unless-stopped

    manager:
        image: ghcr.io/nlightn22/mivend-manager:${IMAGE_TAG:-latest}
        environment:
            API_TARGET: http://server:3000
        ports:
            - '${MANAGER_PORT:-8005}:80'
        depends_on:
            - server
        restart: unless-stopped

volumes:
    postgres-data:
    rabbitmq-data:
