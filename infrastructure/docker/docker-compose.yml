# Production stack. Every parameter comes from the env file (.env.production.example); a variable
# written ${NAME:?...} has no default and the stack refuses to start without it.
x-logging: &logging
    driver: json-file
    options:
        max-size: '10m'
        max-file: '5'

x-server-env: &server-env
    NODE_ENV: production
    TZ: ${TZ:-UTC}
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
    DB_EXPECTED_LOCALE: ${DB_ICU_LOCALE:?DB_ICU_LOCALE must be set explicitly (e.g. ru-RU) — see docs/environments.md}
    INSTANCE_TYPE: ${INSTANCE_TYPE:?INSTANCE_TYPE must be central or branch}
    INSTANCE_ID: ${INSTANCE_ID:?INSTANCE_ID is required (unique per instance, e.g. central or branch-a)}
    INSTANCE_NUMBER_CODE: ${INSTANCE_NUMBER_CODE:?INSTANCE_NUMBER_CODE is required (exactly 3 digits, unique per instance)}
    BOOTSTRAP_BRANCH_NAMES: ${BOOTSTRAP_BRANCH_NAMES:-Main}
    SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:?SUPERADMIN_USERNAME is required}
    SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?SUPERADMIN_PASSWORD is required}
    COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required (same for every process)}
    SESSION_MAX_ACTIVE_CUSTOMER: ${SESSION_MAX_ACTIVE_CUSTOMER:-2}
    SESSION_MAX_ACTIVE_STAFF: ${SESSION_MAX_ACTIVE_STAFF:-3}
    SESSION_DAILY_RESET_ENABLED: ${SESSION_DAILY_RESET_ENABLED:-false}
    SESSION_DAILY_RESET_HOUR: ${SESSION_DAILY_RESET_HOUR:-3}
    SESSION_KNOWN_DEVICE_RETENTION_DAYS: ${SESSION_KNOWN_DEVICE_RETENTION_DAYS:-400}
    TWO_FACTOR_REQUIRED: ${TWO_FACTOR_REQUIRED:-false}
    TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-}
    OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
    SIGN_IN_THROTTLE_ENABLED: ${SIGN_IN_THROTTLE_ENABLED:-false}
    SIGN_IN_THROTTLE_LOGIN_IP_THRESHOLD: ${SIGN_IN_THROTTLE_LOGIN_IP_THRESHOLD:-5}
    SIGN_IN_THROTTLE_LOGIN_THRESHOLD: ${SIGN_IN_THROTTLE_LOGIN_THRESHOLD:-50}
    SIGN_IN_THROTTLE_BASE_LOCK_SECONDS: ${SIGN_IN_THROTTLE_BASE_LOCK_SECONDS:-30}
    SIGN_IN_THROTTLE_MAX_LOCK_SECONDS: ${SIGN_IN_THROTTLE_MAX_LOCK_SECONDS:-900}
    SIGN_IN_THROTTLE_RESET_AFTER_SECONDS: ${SIGN_IN_THROTTLE_RESET_AFTER_SECONDS:-3600}
    SIGN_IN_TRUSTED_PROXY_HOPS: ${SIGN_IN_TRUSTED_PROXY_HOPS:-2}
    SIGN_IN_CAPTCHA_AFTER_FAILURES: ${SIGN_IN_CAPTCHA_AFTER_FAILURES:-3}
    CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-}
    CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
    CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
    CAPTCHA_SCRIPT_URL: ${CAPTCHA_SCRIPT_URL:-}
    CAPTCHA_VERIFY_URL: ${CAPTCHA_VERIFY_URL:-}
    CAPTCHA_WIDGET_GLOBAL: ${CAPTCHA_WIDGET_GLOBAL:-}
    PASSWORD_BREACH_CHECK_ENABLED: ${PASSWORD_BREACH_CHECK_ENABLED:-false}
    PASSWORD_BREACH_API_URL: ${PASSWORD_BREACH_API_URL:-}
    PASSWORD_BREACH_TIMEOUT_MS: ${PASSWORD_BREACH_TIMEOUT_MS:-3000}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    MANAGER_PUBLIC_URL: ${MANAGER_PUBLIC_URL:-}
    STOREFRONT_PUBLIC_URL: ${STOREFRONT_PUBLIC_URL:-}
    RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASS:?RABBITMQ_PASS is required}@rabbitmq:5672
    S3_ENDPOINT: http://garage:3900
    S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    DOCUMENT_PDF_DIR: /data/document-pdfs
    SEARCH_BACKEND: ${SEARCH_BACKEND:?SEARCH_BACKEND must be internal or external}
    ELASTICSEARCH_HOST: http://elasticsearch:9200
    SEARCH_SERVICE_URL: ${SEARCH_SERVICE_URL:-}
    SEARCH_SERVICE_API_KEY: ${SEARCH_SERVICE_API_KEY:-}
    SEARCH_END_USER_ID_SECRET: ${SEARCH_END_USER_ID_SECRET:-}
    ADDRESS_SUGGEST_URL: ${ADDRESS_SUGGEST_URL:-}
    ADDRESS_SUGGEST_API_KEY: ${ADDRESS_SUGGEST_API_KEY:-}
    CONSISTENCY_SEARCH_SERVICE_ENABLED: ${CONSISTENCY_SEARCH_SERVICE_ENABLED:-false}
    CONSISTENCY_SEARCH_SERVICE_URL: ${CONSISTENCY_SEARCH_SERVICE_URL:-}
    CONSISTENCY_SEARCH_SERVICE_API_KEY: ${CONSISTENCY_SEARCH_SERVICE_API_KEY:-}
    INTEGRATION_KAFKA_ENABLED: ${INTEGRATION_KAFKA_ENABLED:-false}
    INTEGRATION_KAFKA_BROKERS: ${INTEGRATION_KAFKA_BROKERS:-localhost:9094}
    INTEGRATION_KAFKA_CLIENT_ID: ${INTEGRATION_KAFKA_CLIENT_ID:-}
    INTEGRATION_KAFKA_CONSUMER_CLIENT_ID: ${INTEGRATION_KAFKA_CONSUMER_CLIENT_ID:-}
    INTEGRATION_KAFKA_CONSUMER_GROUP_ID: ${INTEGRATION_KAFKA_CONSUMER_GROUP_ID:-}
    INTEGRATION_KAFKA_SASL_USERNAME: ${INTEGRATION_KAFKA_SASL_USERNAME:-}
    INTEGRATION_KAFKA_SASL_PASSWORD: ${INTEGRATION_KAFKA_SASL_PASSWORD:-}
    INTEGRATION_KAFKA_CA_PATH: ${INTEGRATION_KAFKA_CA_PATH:-}
    INTEGRATION_SCHEMA_REGISTRY_URL: ${INTEGRATION_SCHEMA_REGISTRY_URL:-}
    INTEGRATION_SERVICE_BASE_URL: ${INTEGRATION_SERVICE_BASE_URL:-}
    INTEGRATION_SERVICE_API_KEY: ${INTEGRATION_SERVICE_API_KEY:-}
    INTEGRATION_RESYNC_SOURCE_SYSTEM: ${INTEGRATION_RESYNC_SOURCE_SYSTEM:-}
    INTEGRATION_DEFAULT_VAT_CODE: ${INTEGRATION_DEFAULT_VAT_CODE:-}
    EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:?EMAIL_TRANSPORT must be smtp or file}
    EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
    EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-}
    EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-}
    EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
    EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
    EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
    SITE_NAME: ${SITE_NAME:-}
    SITE_DEFAULT_LANGUAGE: ${SITE_DEFAULT_LANGUAGE:-}
    EMAIL_FOOTER_TEXT: ${EMAIL_FOOTER_TEXT:-}
    BOOTSTRAP_LOCK_TIMEOUT_MS: ${BOOTSTRAP_LOCK_TIMEOUT_MS:-300000}
    NOTIFICATION_RETENTION_READ_DAYS: ${NOTIFICATION_RETENTION_READ_DAYS:-90}
    NOTIFICATION_RETENTION_UNREAD_DAYS: ${NOTIFICATION_RETENTION_UNREAD_DAYS:-365}
    GEO_PROVIDERS: ${GEO_PROVIDERS:-provider-a,provider-b,open}
    GEO_DEFAULT_PROVIDER: ${GEO_DEFAULT_PROVIDER:-provider-b}
    GEO_DEFAULT_ZOOM: ${GEO_DEFAULT_ZOOM:-10}
    GEO_DEFAULT_CENTER_LAT: ${GEO_DEFAULT_CENTER_LAT:-}
    GEO_DEFAULT_CENTER_LNG: ${GEO_DEFAULT_CENTER_LNG:-}
    GEO_PROVIDER_USER_AGENT: ${GEO_PROVIDER_USER_AGENT:-}
    GEO_PROVIDER_A_BROWSER_KEY: ${GEO_PROVIDER_A_BROWSER_KEY:-}
    GEO_PROVIDER_B_BROWSER_KEY: ${GEO_PROVIDER_B_BROWSER_KEY:-}
    GEO_PROVIDER_A_BROWSER_SUGGEST_KEY: ${GEO_PROVIDER_A_BROWSER_SUGGEST_KEY:-}
    GEO_PROVIDER_A_BROWSER_SEARCH_KEY: ${GEO_PROVIDER_A_BROWSER_SEARCH_KEY:-}
    GEO_PROVIDER_A_BROWSER_HOST: ${GEO_PROVIDER_A_BROWSER_HOST:-}
    GEO_OPEN_URL: ${GEO_OPEN_URL:-}
    # REST surfaces are closed by default (docs/environments.md); keep these false in production.
    EMAIL_DEV_MAILBOX_ENABLED: 'false'
    API_DOCS_ENABLED: 'false'
    ERP_CALLBACK_ENABLED: 'false'
    ERP_IMPORT_ENABLED: 'false'

x-server: &server
    image: ghcr.io/nlightn22/mivend-server:${IMAGE_TAG:?IMAGE_TAG is required (a published version, e.g. v0.0.1)}
    environment: *server-env
    volumes:
        - document-pdfs:/data/document-pdfs
        - ${KAFKA_TLS_DIR:-../kafka-tls}:/run/kafka-tls:ro
    depends_on:
        postgres:
            condition: service_healthy
        rabbitmq:
            condition: service_healthy
        garage:
            condition: service_healthy
        elasticsearch:
            condition: service_healthy
            required: false
    restart: unless-stopped
    logging: *logging

services:
    # server and workers wait for it to finish (depends_on), see docs/environments.md "Migrations".
    migrate:
        <<: *server
        command: ['node', 'dist/migration.js', 'run']
        restart: 'no'

    server:
        <<: *server
        depends_on:
            migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            garage:
                condition: service_healthy
        environment:
            <<: *server-env
            PORT: 3000
        ports:
            - '${SERVER_BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-3000}:3000'
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 240s
        deploy:
            resources:
                limits:
                    memory: ${SERVER_MEM_LIMIT:-2g}

    server-admin:
        <<: *server
        depends_on:
            migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            garage:
                condition: service_healthy
        environment:
            <<: *server-env
            PORT: 3000
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 240s
        deploy:
            resources:
                limits:
                    memory: ${SERVER_ADMIN_MEM_LIMIT:-2g}

    worker:
        <<: *server
        depends_on:
            migrate:
                condition: service_completed_successfully
            server:
                condition: service_healthy
            server-admin:
                condition: service_healthy
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            garage:
                condition: service_healthy
        command: ['node', 'dist/worker.js']
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    '[ ! -f /tmp/kafka-consumer-expected ] || test -f /tmp/kafka-consumer-connected',
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 180s
        deploy:
            resources:
                limits:
                    memory: ${WORKER_MEM_LIMIT:-2g}

    worker-email:
        <<: *server
        depends_on:
            migrate:
                condition: service_completed_successfully
            server:
                condition: service_healthy
            server-admin:
                condition: service_healthy
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            garage:
                condition: service_healthy
        command: ['node', 'dist/worker-email.js']
        deploy:
            resources:
                limits:
                    memory: ${WORKER_EMAIL_MEM_LIMIT:-1g}

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
            POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
            # Issue #140: the locale is fixed at initdb time and has no default, see docs/environments.md.
            POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=${DB_ICU_LOCALE:?DB_ICU_LOCALE must be set explicitly (e.g. ru-RU) — see docs/environments.md}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
            interval: 10s
            timeout: 5s
            retries: 5
        deploy:
            resources:
                limits:
                    memory: ${POSTGRES_MEM_LIMIT:-2g}
        restart: unless-stopped
        logging: *logging

    rabbitmq:
        image: rabbitmq:3.13-management-alpine
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
            interval: 30s
            timeout: 10s
            retries: 10
        restart: unless-stopped
        logging: *logging

    # S3-compatible object storage for product photos. Bucket and key are created once by
    # `make prod-init-storage`.
    garage:
        image: dxflrs/garage:v1.1.0
        environment:
            GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required (64 hex chars)}
        volumes:
            - ./garage/garage.prod.toml:/etc/garage.toml:ro
            - garage-data:/var/lib/garage
        healthcheck:
            test: ['CMD', '/garage', 'status']
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped
        logging: *logging

    # Only for SEARCH_BACKEND=internal: enabled by COMPOSE_PROFILES=internal-search in the env file.
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
        profiles: ['internal-search']
        environment:
            discovery.type: single-node
            xpack.security.enabled: 'false'
            ES_JAVA_OPTS: -Xms${ES_HEAP:-512m} -Xmx${ES_HEAP:-512m}
        volumes:
            - elasticsearch-data:/usr/share/elasticsearch/data
        healthcheck:
            test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
            interval: 15s
            timeout: 10s
            retries: 10
        restart: unless-stopped
        logging: *logging

    # Production builds served via nginx (issue #115). Publishing these ports is decided by the
    # publish-service workflow, not here.
    storefront:
        image: ghcr.io/nlightn22/mivend-storefront:${STOREFRONT_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required (a published version, e.g. v0.0.1)}}
        environment:
            API_TARGET: http://server:3000
            TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
            SITE_NAME: ${SITE_NAME:-Shop}
            SITE_FAVICON_URL: ${SITE_FAVICON_URL:-/favicon.svg}
            MANAGER_PUBLIC_URL: ${MANAGER_PUBLIC_URL:-}
        ports:
            - '${STOREFRONT_BIND_ADDRESS:-127.0.0.1}:${STOREFRONT_PORT:-8004}:80'
        depends_on:
            - server
        healthcheck:
            test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
            interval: 30s
            timeout: 5s
            retries: 3
        restart: unless-stopped
        logging: *logging

    manager:
        image: ghcr.io/nlightn22/mivend-manager:${MANAGER_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required (a published version, e.g. v0.0.1)}}
        environment:
            API_TARGET: http://server-admin:3000
            TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
            SITE_NAME: ${SITE_NAME:-Shop}
            SITE_FAVICON_URL: ${SITE_FAVICON_URL:-/favicon.svg}
        ports:
            - '${MANAGER_BIND_ADDRESS:-127.0.0.1}:${MANAGER_PORT:-8005}:80'
        depends_on:
            - server-admin
        healthcheck:
            test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
            interval: 30s
            timeout: 5s
            retries: 3
        restart: unless-stopped
        logging: *logging

    dashboard:
        image: ghcr.io/nlightn22/mivend-dashboard:${DASHBOARD_IMAGE_TAG:-${IMAGE_TAG:?IMAGE_TAG is required (a published version, e.g. v0.0.1)}}
        environment:
            API_TARGET: http://server-admin:3000
            TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
            SITE_FAVICON_URL: ${SITE_FAVICON_URL:-/favicon.png}
        ports:
            - '${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8006}:80'
        depends_on:
            - server-admin
        healthcheck:
            test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
            interval: 30s
            timeout: 5s
            retries: 3
        restart: unless-stopped
        logging: *logging

volumes:
    postgres-data:
    rabbitmq-data:
    garage-data:
    elasticsearch-data:
    document-pdfs:
