# Example filter (install as /etc/fail2ban/filter.d/nginx-sign-in-limit.conf). Matches requests the proxy
# refused with 429 on the Shop/Admin API; the rate-limited sign-in traffic is the only thing that gets 429 there.
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "[A-Z]+ /(shop|admin)-api[^"]*" 429 
ignoreregex =
